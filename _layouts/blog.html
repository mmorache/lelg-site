---
layout: default
---

<div class="home">
  <h1 class="page-heading">{{ page.title }}</h1>

<img
  src="/assets/images/yawn.jpg"
  alt="your music is boring"
  style="display:block; max-width:auto; max-height: 400px; height:auto; margin:2rem auto;"
>

  <ul class="post-list">
    {% for post in site.posts %}
      <li>
        <span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
        <h2>
          <a class="post-link" href="{{ post.url | relative_url }}">
            {{ post.title | escape }}
          </a>
        </h2>
      </li>
    {% endfor %}
  </ul>
</div>
